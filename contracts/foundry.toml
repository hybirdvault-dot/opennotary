[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/contracts/=../lib/openzeppelin-contracts/contracts/",
    "forge-std/=../lib/forge-std/src/",
]
# Read-only access to the cross-language parity fixture (Batch 6 Parity.t.sol).
fs_permissions = [{ access = "read", path = "../test/fixtures" }]

[fmt]
line_length = 120

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
